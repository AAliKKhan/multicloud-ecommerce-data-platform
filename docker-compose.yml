# Local development topology. NOT a highly available production cluster: one
# single-node Kafka broker (KRaft, no ZooKeeper), so there is no broker fault
# tolerance and every replication factor is 1.
#
#   docker compose up -d kafka kafka-init kafka-ui
#   docker compose down            # keep data
#   docker compose down -v         # also delete the Kafka data volume
#
# Resource guidance: the stack is sized for a machine with ~8 GB RAM and a
# WSL2 cap of ~5 GB (see docs/docker.md). All published ports are bound to
# 127.0.0.1 so nothing is reachable from other machines.
name: ecomm

# Airflow (profile "airflow"): not started by default.
#   python docker/airflow/generate_env.py          # once: random secrets, git-ignored
#   docker compose --profile airflow up -d --build
# See docs/airflow.md. Memory: about 2.5 GB in total, so stop Spark and Kafka UI while it runs on
# an 8 GB machine.
x-airflow-common: &airflow-common
  image: ecomm-airflow:2.10.5
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: ["airflow"]
  # Arbitrary UID (group 0) is how the official image supports bind mounts on Linux/CI.
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - path: docker/airflow/.env
      required: false # a missing file is reported by require-secrets.sh with instructions
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true" # nothing runs until you unpause it
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: "False"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
    AIRFLOW__SCARF_ANALYTICS__SCARF_ANALYTICS: "false"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    ECOMM_DATA_DIR: /data/pipeline
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/ecomm/src:ro
    - ./dbt:/opt/ecomm/dbt:ro
    - ${AIRFLOW_DATA_DIR:-./data/spark}:/data/pipeline
    - airflow-logs:/opt/airflow/logs
  entrypoint: ["/opt/airflow/require-secrets.sh", "/usr/bin/dumb-init", "--", "/entrypoint"]

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: ecomm-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST: for clients on your machine (127.0.0.1:9092; IPv4 on purpose, because
      #       the port is published on the IPv4 loopback only)
      # INTERNAL: for other containers (kafka:19092)
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:${KAFKA_HOST_PORT:-9092},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single node: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (kafka-init), never implicitly by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image defaults to /tmp, which is lost when the container is recreated.
      # Data (and the KRaft metadata) must live on the named volume.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 900m

  # One-shot job: creates the topics and exits. Safe to re-run (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: ecomm-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-commerce}
    volumes:
      - ./docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    mem_limit: 256m

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    container_name: ecomm-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # Authentication is off: loopback only. Do not expose this port.
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    mem_limit: 640m

  # Spark Structured Streaming job (profile "spark": not started by default).
  #   docker compose --profile spark run --rm spark                 # drain the topics, then exit
  #   docker compose --profile spark run --rm spark --trigger processing-time:10s
  # Output goes to ./data/spark (lake/, checkpoints/) on the host. The source tree is
  # bind-mounted read-only, so code edits need no image rebuild.
  spark:
    profiles: ["spark"]
    image: ecomm-spark:3.5.6
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: ecomm-spark
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-commerce}
      LATE_EVENT_THRESHOLD_MINUTES: ${LATE_EVENT_THRESHOLD_MINUTES:-60}
    volumes:
      - ./src:/app/src:ro
      - ./data/spark:/data
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"
    # Arguments after the service name are passed to the job (they would REPLACE a
    # `command`, so the module is the entrypoint instead).
    entrypoint: ["/usr/bin/tini", "--", "python", "-m", "ecomm.spark.job"]
    mem_limit: 2g

  airflow-postgres:
    profiles: ["airflow"]
    image: postgres:16-alpine
    container_name: ecomm-airflow-postgres
    restart: unless-stopped
    env_file:
      - path: docker/airflow/.env
        required: false
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published port: only the Airflow containers reach the database.
    mem_limit: 384m

  airflow-init:
    <<: *airflow-common
    container_name: ecomm-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"
    command: ["bash", "/opt/airflow/init.sh"]
    mem_limit: 768m

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecomm-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    mem_limit: 1200m

  airflow-webserver:
    <<: *airflow-common
    container_name: ecomm-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["webserver"]
    ports:
      # Login is required, but keep it on loopback anyway. Do not expose this port.
      - "127.0.0.1:${AIRFLOW_UI_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 1g

  # --- Monitoring (profile "monitoring": not started by default) -----------------------------
  #   python docker/monitoring/generate_env.py --print-password    # once: random Grafana login
  #   docker compose --profile monitoring up -d --build
  # Prometheus http://127.0.0.1:9090, Grafana http://127.0.0.1:3000. About 0.8 GB in total.
  ecomm-exporter:
    profiles: ["monitoring"]
    image: ecomm-exporter:1
    build:
      context: .
      dockerfile: docker/exporter/Dockerfile
    container_name: ecomm-exporter
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ${PIPELINE_DATA_DIR:-./data/spark}:/data/pipeline:ro
    # No published port: only Prometheus (same network) scrapes it.
    mem_limit: 256m

  kafka-exporter:
    profiles: ["monitoring"]
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: ecomm-kafka-exporter
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:19092", "--topic.filter=^commerce\\.", "--group.filter=^$"]
    # No published port. Spark tracks its own offsets (no consumer group), so group metrics are
    # switched off by the empty filter; lag is derived from partition end offsets in Prometheus.
    mem_limit: 128m

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: ecomm-prometheus
    restart: unless-stopped
    depends_on:
      - ecomm-exporter
      - kafka-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # The HTTP lifecycle API (reload/quit) stays at its default: disabled.
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      # No authentication: loopback only. Do not expose this port.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.6.0
    container_name: ecomm-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    env_file:
      - path: docker/monitoring/.env
        required: false # a missing file is reported by require-secret.sh with instructions
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline_health.json
    entrypoint: ["/bin/sh", "/require-secret.sh", "/run.sh"]
    volumes:
      - ./docker/monitoring/require-secret.sh:/require-secret.sh:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Login is required, but keep it on loopback anyway. Do not expose this port.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m

  # --- BI: Metabase over a published copy of the marts (profile "bi") ---
  # First time:
  #   python docker/bi/generate_env.py --print-login      # random secrets, git-ignored
  #   docker compose --profile bi up -d
  #   uv run ecomm-bi publish && uv run ecomm-bi provision
  # Metabase http://127.0.0.1:3001. About 1.2 GB in total; stop Kafka UI and Spark first on 8 GB RAM.
  metabase-postgres:
    profiles: ["bi"]
    image: postgres:16-alpine
    container_name: ecomm-metabase-postgres
    restart: unless-stopped
    env_file:
      - path: docker/bi/.env
        required: false # a missing file is reported by init-databases.sh with instructions
      - path: docker/bi/.env.postgres # superuser password: this container only
        required: false
    volumes:
      - ./docker/bi/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - metabase-pgdata:/var/lib/postgresql/data
    ports:
      # Holds the published marts for the host-side publisher. Loopback only.
      - "127.0.0.1:${BI_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ecomm_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomm_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m

  metabase:
    profiles: ["bi"]
    image: metabase/metabase:v0.65.3
    container_name: ecomm-metabase
    restart: unless-stopped
    depends_on:
      metabase-postgres:
        condition: service_healthy
    env_file:
      - path: docker/bi/.env
        required: false # a missing file is reported by require-secrets.sh with instructions
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: "-Xmx768m"
    entrypoint: ["/bin/sh", "/require-secrets.sh", "MB_DB_PASS", "/app/run_metabase.sh"]
    volumes:
      - ./docker/bi/require-secrets.sh:/require-secrets.sh:ro
    ports:
      # Login is required, but keep it on loopback anyway. Do not expose this port.
      - "127.0.0.1:${METABASE_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    mem_limit: 1100m

volumes:
  kafka-data:
  metabase-pgdata:
  airflow-pgdata:
  airflow-logs:
  prometheus-data:
  grafana-data:
