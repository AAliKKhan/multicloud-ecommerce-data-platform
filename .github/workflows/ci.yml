name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked, with cloud extras and dbt)
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration and not cloud and not dbt" --cov=ecomm --cov-report=term-missing

  dbt:
    name: dbt build (DuckDB) and BigQuery syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked, with cloud extras and dbt)
        run: uv sync --locked --all-extras

      # Runs the full Docker-free pipeline, a real `dbt build` on DuckDB, an
      # independent metric cross-check, a replay test and an offline compile of
      # the BigQuery SQL. No cloud credentials are used or required.
      - name: dbt end-to-end tests
        run: uv run pytest -m dbt -v

  terraform:
    name: Terraform fmt and validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, gcp]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      # No backend and no credentials: this never contacts a cloud account.
      # `plan` and `apply` are deliberately NOT run in CI.
      - name: Init (providers only)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  kafka:
    name: Kafka integration (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked, with the kafka extra)
        run: uv sync --locked --all-extras

      - name: Validate the compose file
        run: docker compose config --quiet

      # Only the broker is needed: the tests create and delete their own topics.
      - name: Start Kafka
        run: docker compose up -d --wait kafka

      - name: Kafka integration tests
        run: uv run pytest tests/integration/test_kafka.py -v

      - name: Broker logs (on failure)
        if: failure()
        run: docker compose logs kafka --tail 100

      - name: Stop and remove containers and volumes
        if: always()
        run: docker compose down -v

  spark:
    name: Spark streaming integration (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked, with the kafka extra)
        run: uv sync --locked --all-extras

      # Python 3.11 + Java 17 + PySpark + the Kafka connector jars (several minutes).
      - name: Build the Spark image
        run: docker compose --profile spark build spark

      - name: Start Kafka
        run: docker compose up -d --wait kafka

      # Crash right after a commit, restart, rerun with nothing new, compare with the
      # reference ingest, load the warehouse, plus the too-short-retention regression test.
      - name: Spark integration tests
        run: uv run pytest tests/integration/test_spark.py -v

      - name: Broker logs (on failure)
        if: failure()
        run: docker compose logs kafka --tail 100

      - name: Stop and remove containers and volumes
        if: always()
        run: docker compose down -v

  airflow:
    name: Airflow DAGs (real Airflow in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked, with extras)
        run: uv sync --locked --all-extras

      - name: Validate the compose file with the airflow profile
        run: docker compose --profile airflow config --quiet

      # Official Airflow image plus an isolated virtualenv with dbt and DuckDB (several minutes).
      - name: Build the Airflow image
        run: docker compose --profile airflow build airflow-init

      # Airflow itself must accept the DAGs: imports, parameters, dataset scheduling, and the
      # retry/timeout/pool policy on the real task objects.
      - name: Parse the DAGs with real Airflow
        run: uv run pytest tests/integration/test_airflow.py -v

      # Generate a fresh lake, then let Airflow run every DAG once against it. The container runs
      # as the runner's UID so it can write the bind-mounted directory.
      - name: Run all four DAGs end to end (airflow dags test)
        run: |
          set -o pipefail   # the pipe into tee must not hide the container's exit code
          uv run ecomm-demo --out data/pipeline --orders 120 --days 3 --batches 3 > /dev/null
          rm -f data/pipeline/warehouse.duckdb   # the DAGs must load and model it themselves
          docker run --rm --user "$(id -u):0" \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -v "$PWD/src:/opt/ecomm/src:ro" \
            -v "$PWD/dbt:/opt/ecomm/dbt:ro" \
            -v "$PWD/scripts/airflow_dags_smoke.sh:/smoke.sh:ro" \
            -v "$PWD/data/pipeline:/data/pipeline" \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/smoke.db \
            -e AIRFLOW__SCARF_ANALYTICS__SCARF_ANALYTICS=false \
            --entrypoint bash ecomm-airflow:2.10.5 /smoke.sh 2>&1 | tee airflow-dags-test.log
          # Absence of a failure message is not success: all four DAGs must have reported it.
          grep -q '^ALL_DAGS_OK$' airflow-dags-test.log || { echo "DAG smoke test did not complete"; exit 1; }
          grep -q 'DAG_FAILED' airflow-dags-test.log && { echo "a DAG failed"; exit 1; }
          test -f data/pipeline/warehouse.duckdb || { echo "the DAGs produced no warehouse"; exit 1; }

      # Independent check of what the DAGs produced: the project's own quality suite on the
      # warehouse Airflow built (exit code 1 on any FAIL), and the reconciliation.
      - name: Verify the DAG output
        run: |
          uv run ecomm-quality --demo-dir data/pipeline --no-persist
          uv run ecomm-reconcile --demo-dir data/pipeline

      - name: Task logs (on failure)
        if: failure()
        run: tail -n 150 airflow-dags-test.log || true
