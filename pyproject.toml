[project]
name = "ecomm-platform"
version = "0.1.0"
description = "Multi-cloud e-commerce data platform (synthetic data, local-first)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.scripts]
ecomm-generate = "ecomm.generator.cli:main"
ecomm-demo = "ecomm.demo:main"
ecomm-quality = "ecomm.quality.cli:main"
ecomm-metrics = "ecomm.observability.cli:main"
ecomm-quarantine = "ecomm.lake.quarantine_cli:main"
ecomm-report = "ecomm.report.cli:main"
ecomm-kafka = "ecomm.producer.cli:main"
ecomm-load = "ecomm.warehouse.cli:main"

[project.optional-dependencies]
aws = [
    "boto3>=1.35,<2",
]
gcp = [
    "google-cloud-bigquery>=3.25,<4",
    "google-cloud-storage>=2.18,<4",
]
kafka = [
    "confluent-kafka>=2.5,<3",
]

[dependency-groups]
dbt = [
    "dbt-bigquery>=1.9,<2",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "moto[s3]>=5,<6",
    "pyyaml>=6,<7",
]

[tool.uv]
default-groups = ["dev", "dbt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecomm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs running Docker services (Kafka, MinIO, Spark); skipped when absent",
    "cloud: needs real AWS/GCP credentials; skipped unless explicitly enabled",
    "dbt: runs the dbt CLI in a subprocess (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "E501"]  # long SQL/regex literals are clearer unwrapped
# HTML/CSS/SVG template strings and operator hint text read better unwrapped.
"src/ecomm/report/*.py" = ["E501"]
# PySpark's own conventions: `functions as F`, `types as T`; long usage lines in the docstring.
"src/ecomm/spark/job.py" = ["N812", "E501"]
"src/ecomm/lake/quarantine_cli.py" = ["E501"]
# SQL is built only from validated identifiers and literals (see safe_identifier).
"src/ecomm/warehouse/**" = ["S608"]
"src/ecomm/quality/checks.py" = ["S608"]
"src/ecomm/observability/metrics.py" = ["S608"]
"src/ecomm/report/dashboard.py" = ["S608"]
"src/ecomm/quality/models.py" = ["S105"]  # StrEnum member named PASS, not a password
# Seeded PRNG is intentional: reproducible synthetic data, nothing cryptographic.
"src/ecomm/generator/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "google.*",
    "duckdb.*",
    "confluent_kafka.*",
    "pyspark.*",
    "pandas.*",
]
ignore_missing_imports = true

# The Spark job only runs inside the Spark container (PySpark and its decorators are
# untyped there); its logic lives in the strictly typed, unit-tested sibling modules.
[[tool.mypy.overrides]]
module = "ecomm.spark.job"
ignore_errors = true
