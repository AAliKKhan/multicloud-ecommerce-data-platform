[project]
name = "ecomm-platform"
version = "0.1.0"
description = "Multi-cloud e-commerce data platform (synthetic data, local-first)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.scripts]
ecomm-generate = "ecomm.generator.cli:main"

[project.optional-dependencies]
aws = [
    "boto3>=1.35,<2",
]
gcp = [
    "google-cloud-bigquery>=3.25,<4",
    "google-cloud-storage>=2.18,<4",
]

[dependency-groups]
dbt = [
    "dbt-bigquery>=1.9,<2",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "moto[s3]>=5,<6",
]

[tool.uv]
default-groups = ["dev", "dbt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecomm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker services (Kafka, MinIO, Spark)",
    "cloud: needs real AWS/GCP credentials; skipped unless explicitly enabled",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]
# SQL is built only from validated identifiers and literals (see safe_identifier).
"src/ecomm/warehouse/**" = ["S608"]
# Seeded PRNG is intentional: reproducible synthetic data, nothing cryptographic.
"src/ecomm/generator/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "google.*", "duckdb.*"]
ignore_missing_imports = true
