# Prometheus scrape configuration for the docker-compose "monitoring" profile.
# Validated with `promtool check config` (tests/integration/test_monitoring.py).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Pipeline + business metrics (ecomm-metrics --serve, in the ecomm-exporter container).
  - job_name: ecomm-pipeline
    static_configs:
      - targets: ["ecomm-exporter:9108"]
        labels:
          environment: local

  # Kafka broker and topic-partition offsets (consumer lag is derived: Spark keeps its own offsets).
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          environment: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Not scraped yet, and honestly so:
  #   - Spark driver metrics exist only while a query is running (port 4040 of the one-shot
  #     container); per-batch progress is exported through ecomm_spark_* from the control store.
  #   - Airflow task and DAG metrics need a StatsD exporter, which is not part of the stack.
