# Alert rules for the pipeline. Loaded by Prometheus in the docker-compose "monitoring" profile.
# Checked three ways: `promtool check rules`, `promtool test rules` against monitoring/prometheus/
# alerts_test.yml (real Prometheus evaluation of synthetic series), and unit tests that every
# ecomm_* metric referenced here is really exposed by the exporter.
groups:
  - name: ecomm-pipeline
    rules:
      - alert: PipelineStale
        expr: ecomm_seconds_since_last_successful_load > 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No successful warehouse load for more than 24 hours.
          runbook: docs/operations.md#runbooks (pipeline is stale)

      - alert: BatchesNotComplete
        expr: ecomm_batches{status=~"PARTIAL|FAILED"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A raw batch is PARTIAL or FAILED (one destination is not committed).
          runbook: docs/operations.md#runbooks (a cloud destination failed)

      - alert: WarehouseLoadFailures
        expr: ecomm_load_attempts{status="FAILED"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: At least one warehouse load attempt failed; check raw.load_audit.

      - alert: HighQuarantineRate
        expr: ecomm_quarantine_rate > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of messages are being quarantined (dead-letter rate).
          runbook: inspect with `ecomm-quarantine`

      - alert: CloudParityMismatch
        expr: ecomm_parity_batches_mismatched > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: S3 and GCS copies of at least one batch disagree.
          runbook: docs/operations.md#runbooks (a cloud destination failed)

      - alert: DataQualityChecksFailing
        expr: ecomm_quality_checks{status="FAIL"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The latest data-quality run has failing checks.

      - alert: MetricsCollectionBroken
        expr: sum(ecomm_scrape_errors) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A pipeline metrics section failed to collect.

      - alert: ExporterCannotReadPipelineData
        expr: ecomm_exporter_ready < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The exporter is up but cannot read the warehouse (not built yet, or locked by a writer).

  - name: ecomm-infrastructure
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A monitored endpoint cannot be scraped (label job says which one).

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: The Kafka exporter sees no broker.

      - alert: SparkConsumerLagHigh
        expr: sum by (topic) (kafka_topic_partition_current_offset{topic=~"commerce\\.(orders|payments|inventory|customers)"} - ignoring(instance, job) ecomm_spark_next_offset) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 1000 messages on a topic are not yet processed by the Spark job.
          runbook: docs/spark.md (start or restart the job; check the retention rule)
